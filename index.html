<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ксюха — легенда 😎</title><style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#fff;background:#100d29}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;overflow-x:hidden;background:radial-gradient(circle at 20% 20%,#6424a5 0,transparent 40%),radial-gradient(circle at 90% 90%,#e72c8e 0,transparent 45%),#100d29}.wrap{text-align:center;padding:32px 18px;max-width:850px}h1{font-size:clamp(3rem,10vw,7rem);line-height:1.03;margin:12px 0;text-shadow:5px 6px #ff238d;animation:wiggle 3s infinite}p{font-size:clamp(1.1rem,3vw,1.6rem)}.tag{display:inline-block;border:2px solid #ffb3df;border-radius:99px;padding:8px 18px;background:#ffffff18}.buttons{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin:30px auto}button{font-size:1.05rem;font-weight:800;padding:17px 24px;border:0;border-radius:16px;cursor:pointer;background:#ffde59;color:#24103a;box-shadow:0 7px 0 #b88212;transition:transform .12s}button:hover{transform:translateY(-4px) rotate(-2deg)}button:active{transform:translateY(5px);box-shadow:0 2px 0 #b88212}.pink{background:#ff73bd;box-shadow:0 7px 0 #b12f78}.blue{background:#7eeaff;box-shadow:0 7px 0 #248aa2}#result{min-height:95px;font-size:clamp(1.3rem,4vw,2rem);font-weight:900;display:grid;place-items:center}.small{opacity:.7;font-size:.9rem;margin-top:35px}.float{position:fixed;pointer-events:none;animation:rise 1.6s ease-out forwards;font-size:32px;z-index:10}@keyframes rise{from{transform:translateY(0) rotate(0);opacity:1}to{transform:translateY(-190px) rotate(35deg);opacity:0}}@keyframes wiggle{0%,90%,100%{transform:rotate(0)}93%{transform:rotate(-2deg)}96%{transform:rotate(2deg)}}
</style></head><body><main class="wrap"><div class="tag">🚨 ОФИЦИАЛЬНЫЙ ФАН-КЛУБ 🚨</div><h1>КСЮХА —<br>ЛЕГЕНДА 😎</h1><p>Учёные доказали: уровень крутости Ксюхи зашкаливает 📈</p><div class="buttons"><button onclick="meme()">🎲 Выдать факт</button><button class="pink" onclick="love()">💩 Выдать Ксюше респект</button><button class="blue" onclick="secret()">🐄 Открыть главный секрет</button></div><div id="result" aria-live="polite">Жми на кнопки, не стесняйся 👆</div><p class="small">Сделано ради мемов. Все совпадения с легендами не случайны.</p></main><script>
const facts=['Ксюха настолько крутая, что Wi-Fi подключается к ней сам 📶','Когда Ксюха заходит в комнату, мемы становятся смешнее 😂','У Ксюхи не бывает плохих дней. Бывают дни, не достойные Ксюхи 😎','Ксюха — причина, по которой существует кнопка «лайк» 👍','Уровень легендарности: 999999% 🚀','Ксюха не опаздывает. Это время приходит раньше неё ⏰'];let n=0;const out=document.getElementById('result');function meme(){out.textContent=facts[Math.floor(Math.random()*facts.length)];burst('😂')}function love(){n++;out.textContent='КСЮХЕ ВЫДАН РЕСПЕКТ 💩 x'+n;for(let j=0;j<5;j++)setTimeout(()=>burst('💩'),j*170)}let audioCtx;function secret(){out.textContent='🐄 МУУУУУ! ГЛАВНЫЙ СЕКРЕТ РАСКРЫТ! 🐄';burst('🐄');try{audioCtx=audioCtx||new(window.AudioContext||window.webkitAudioContext)();audioCtx.resume();const now=audioCtx.currentTime;for(let k=0;k<3;k++){const start=now+k*1.15;const osc=audioCtx.createOscillator(),harm=audioCtx.createOscillator(),gain=audioCtx.createGain(),filter=audioCtx.createBiquadFilter();osc.type='sawtooth';harm.type='triangle';filter.type='lowpass';filter.frequency.value=850;osc.frequency.setValueAtTime(155,start);osc.frequency.linearRampToValueAtTime(105,start+.55);osc.frequency.linearRampToValueAtTime(125,start+1);harm.frequency.setValueAtTime(77,start);harm.frequency.linearRampToValueAtTime(60,start+1);gain.gain.setValueAtTime(.001,start);gain.gain.linearRampToValueAtTime(.65,start+.12);gain.gain.setValueAtTime(.65,start+.75);gain.gain.exponentialRampToValueAtTime(.001,start+1.08);osc.connect(filter);harm.connect(filter);filter.connect(gain);gain.connect(audioCtx.destination);osc.start(start);harm.start(start);osc.stop(start+1.1);harm.stop(start+1.1)}}catch(e){out.textContent='🐄 МУУУ! Включи звук на телефоне!'}}function burst(symbol){for(let i=0;i<13;i++){const e=document.createElement('span');e.className='float';e.textContent=symbol;e.style.left=(10+Math.random()*80)+'vw';e.style.top=(50+Math.random()*40)+'vh';e.style.animationDelay=(Math.random()*.25)+'s';document.body.append(e);setTimeout(()=>e.remove(),2100)}}
</script></body></html>
