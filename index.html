<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ксюха — легенда 😎</title><style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#fff;background:#100d29}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;overflow-x:hidden;background:radial-gradient(circle at 20% 20%,#6424a5 0,transparent 40%),radial-gradient(circle at 90% 90%,#e72c8e 0,transparent 45%),#100d29}.wrap{text-align:center;padding:32px 18px;max-width:850px}h1{font-size:clamp(3rem,10vw,7rem);line-height:1.03;margin:12px 0;text-shadow:5px 6px #ff238d;animation:wiggle 3s infinite}p{font-size:clamp(1.1rem,3vw,1.6rem)}.tag{display:inline-block;border:2px solid #ffb3df;border-radius:99px;padding:8px 18px;background:#ffffff18}.buttons{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin:30px auto}button{font-size:1.05rem;font-weight:800;padding:17px 24px;border:0;border-radius:16px;cursor:pointer;background:#ffde59;color:#24103a;box-shadow:0 7px 0 #b88212;transition:transform .12s}button:hover{transform:translateY(-4px) rotate(-2deg)}button:active{transform:translateY(5px);box-shadow:0 2px 0 #b88212}.pink{background:#ff73bd;box-shadow:0 7px 0 #b12f78}.blue{background:#7eeaff;box-shadow:0 7px 0 #248aa2}#result{min-height:95px;font-size:clamp(1.3rem,4vw,2rem);font-weight:900;display:grid;place-items:center}.small{opacity:.7;font-size:.9rem;margin-top:35px}.float{position:fixed;pointer-events:none;animation:rise 1.6s ease-out forwards;font-size:32px;z-index:10}@keyframes rise{from{transform:translateY(0) rotate(0);opacity:1}to{transform:translateY(-190px) rotate(35deg);opacity:0}}@keyframes wiggle{0%,90%,100%{transform:rotate(0)}93%{transform:rotate(-2deg)}96%{transform:rotate(2deg)}}

.extra{margin:20px auto;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px;max-width:650px}.extra button{width:100%;min-height:76px;background:#b7ff80;box-shadow:0 6px 0 #49872c}.extra button:nth-child(2){background:#ffb6e1;box-shadow:0 6px 0 #a73e80}.extra button:nth-child(3){background:#c8b4ff;box-shadow:0 6px 0 #6b4aac}.extra button:nth-child(4){background:#ffc98d;box-shadow:0 6px 0 #a75c1e}.panel{display:none;background:#1a103de8;border:2px solid #ffffff55;border-radius:20px;padding:20px;margin:20px auto;max-width:600px}.panel.show{display:block}.panel h2{margin:0 0 14px}.answers{display:grid;gap:10px}.answers button{box-shadow:none;background:#fff;color:#21143c}.danger{animation:rageShake .16s linear infinite;background:#790d22!important}.danger:before{content:"🚨 КСЮХА В ЯРОСТИ 🚨";position:fixed;top:0;left:0;right:0;z-index:50;background:#e51d32;color:white;font-size:clamp(18px,5vw,36px);font-weight:900;padding:12px;animation:flash .4s infinite alternate}.bug{position:fixed;z-index:25;pointer-events:none;font-size:30px;transition:transform .2s;animation:bugrun var(--duration) linear forwards}@keyframes rageShake{0%{transform:translate(-4px,2px)}50%{transform:translate(4px,-2px)}100%{transform:translate(-2px,4px)}}@keyframes flash{to{background:#460000}}@keyframes bugrun{from{left:var(--start);top:var(--top);transform:rotate(0)}to{left:var(--end);top:var(--bottom);transform:rotate(900deg)}}@media(max-width:520px){.wrap{padding:25px 12px}.buttons{gap:11px}.buttons button{width:100%;max-width:340px}.extra{gap:10px}.extra button{font-size:.88rem;padding:12px 8px;min-height:76px}.panel{padding:15px}h1{font-size:clamp(2.7rem,12vw,5rem)}}@media(prefers-reduced-motion:reduce){.danger,.danger:before{animation:none}}
.easter{margin:85px auto 20px;padding:25px 12px;border-top:1px solid #ffffff33;max-width:650px}.easter button{background:linear-gradient(120deg,#ff8ac9,#ffe28a);box-shadow:0 7px 0 #a7467b;max-width:100%;white-space:normal}.easter-message{display:none;margin:24px auto 0;font-size:clamp(1.6rem,6vw,3rem);font-weight:900;line-height:1.3;color:#ffe5f3;text-shadow:0 3px 12px #ff3d9b}.easter-message.visible{display:block;animation:revealLove .6s ease-out}@keyframes revealLove{from{opacity:0;transform:scale(.7)}to{opacity:1;transform:scale(1)}}</style></head><body><main class="wrap"><div class="tag">🚨 ОФИЦИАЛЬНЫЙ ФАН-КЛУБ 🚨</div><h1>КСЮХА —<br>ЛЕГЕНДА 😎</h1><p>Учёные доказали: уровень крутости Ксюхи зашкаливает 📈</p><div class="buttons"><button onclick="meme()">🎲 Выдать факт</button><button class="pink" onclick="love()">💩 Выдать Ксюше респект</button><button class="blue" onclick="secret()">🐄 Открыть главный секрет</button></div><section class="extra" aria-label="Новые приколы"><button onclick="rage()">🚨 Ксюха в ярости</button><button onclick="bugs()">🪳 Нашествие тараканов</button><button onclick="startQuiz()">🏆 Тест про Ксюху</button><button onclick="wheel()">🎰 Рулетка судьбы</button></section><section id="panel" class="panel" aria-live="polite"></section><div id="result" aria-live="polite">Жми на кнопки, не стесняйся 👆</div><p class="small">Сделано ради мемов. Все совпадения с легендами не случайны.</p><footer class="easter"><button onclick="revealEaster()">💌 НАЖМИ И УЗНАЕШЬ САМОЕ КРУТОЕ 💌</button><div id="easter-message" class="easter-message" aria-live="polite">Миша безумно любит Варю) ❤️❤️❤️</div></footer></main><script>
const facts=['Ксюха настолько крутая, что Wi-Fi подключается к ней сам 📶','Когда Ксюха заходит в комнату, мемы становятся смешнее 😂','У Ксюхи не бывает плохих дней. Бывают дни, не достойные Ксюхи 😎','Ксюха — причина, по которой существует кнопка «лайк» 👍','Уровень легендарности: 999999% 🚀','Ксюха не опаздывает. Это время приходит раньше неё ⏰'];let n=0;const out=document.getElementById('result');function meme(){out.textContent=facts[Math.floor(Math.random()*facts.length)];burst('😂')}function love(){n++;out.textContent='КСЮХЕ ВЫДАН РЕСПЕКТ 💩 x'+n;for(let j=0;j<5;j++)setTimeout(()=>burst('💩'),j*170)}let audioCtx;function secret(){out.textContent='🐄 МУУУУУ! ГЛАВНЫЙ СЕКРЕТ РАСКРЫТ! 🐄';burst('🐄');try{audioCtx=audioCtx||new(window.AudioContext||window.webkitAudioContext)();audioCtx.resume();const now=audioCtx.currentTime;for(let k=0;k<3;k++){const start=now+k*1.15;const osc=audioCtx.createOscillator(),harm=audioCtx.createOscillator(),gain=audioCtx.createGain(),filter=audioCtx.createBiquadFilter();osc.type='sawtooth';harm.type='triangle';filter.type='lowpass';filter.frequency.value=850;osc.frequency.setValueAtTime(155,start);osc.frequency.linearRampToValueAtTime(105,start+.55);osc.frequency.linearRampToValueAtTime(125,start+1);harm.frequency.setValueAtTime(77,start);harm.frequency.linearRampToValueAtTime(60,start+1);gain.gain.setValueAtTime(.001,start);gain.gain.linearRampToValueAtTime(.65,start+.12);gain.gain.setValueAtTime(.65,start+.75);gain.gain.exponentialRampToValueAtTime(.001,start+1.08);osc.connect(filter);harm.connect(filter);filter.connect(gain);gain.connect(audioCtx.destination);osc.start(start);harm.start(start);osc.stop(start+1.1);harm.stop(start+1.1)}}catch(e){out.textContent='🐄 МУУУ! Включи звук на телефоне!'}}function burst(symbol){for(let i=0;i<13;i++){const e=document.createElement('span');e.className='float';e.textContent=symbol;e.style.left=(10+Math.random()*80)+'vw';e.style.top=(50+Math.random()*40)+'vh';e.style.animationDelay=(Math.random()*.25)+'s';document.body.append(e);setTimeout(()=>e.remove(),2100)}}

let rageTimer,bugTimers=[],quizIndex=0,quizScore=0,wheelBusy=false;
const panel=document.getElementById('panel');
function showPanel(markup){panel.innerHTML=markup;panel.classList.add('show');panel.scrollIntoView({behavior:'smooth',block:'nearest'})}
function rage(){clearTimeout(rageTimer);document.body.classList.add('danger');out.textContent='🚨 СПАСАЙТЕСЬ! КСЮХА В ЯРОСТИ! 🚨';burst('🔥');rageTimer=setTimeout(()=>document.body.classList.remove('danger'),3500)}
function bugs(){out.textContent='🪳 ТАРАКАНЫ ЗАХВАТИЛИ САЙТ!';for(let i=0;i<32;i++){const b=document.createElement('span');b.className='bug';b.textContent='🪳';b.style.setProperty('--start',Math.random()<.5?'-10vw':'105vw');b.style.setProperty('--end',(Math.random()*100)+'vw');b.style.setProperty('--top',(Math.random()*100)+'vh');b.style.setProperty('--bottom',(Math.random()*100)+'vh');const duration=2+Math.random()*4;b.style.setProperty('--duration',duration+'s');document.body.appendChild(b);setTimeout(()=>b.remove(),duration*1000+100)}} 
const quiz=[
{q:'Что делает Ксюха, когда заходит в комнату?',a:['Включает режим легенды 😎','Ищет тапки','Проверяет погоду'],correct:0},
{q:'Какой суперсилой обладает Ксюха?',a:['Телепортирует пельмени 🥟','Управляет всеми мемами 😂','Превращается в шкаф'],correct:1},
{q:'Что происходит при виде Ксюхи?',a:['Wi-Fi ловит лучше 📶','Исчезает гравитация','Все часы идут назад'],correct:0},
{q:'Кто главный босс этого сайта?',a:['Таракан','Ксюха 👑','Холодильник'],correct:1},
{q:'Какой титул заслуживает Ксюха?',a:['Мастер дивана','Повелительница носков','Легенда 999 уровня 🏆'],correct:2}
];
function startQuiz(){quizIndex=0;quizScore=0;renderQuiz()}
function renderQuiz(){if(quizIndex>=quiz.length){showPanel('<h2>🏆 Тест завершён!</h2><p>Ты Ксюха на '+(quizScore*20+99)+'%! 😂</p><button onclick="startQuiz()">Пройти ещё раз</button>');burst('🏆');return}const q=quiz[quizIndex];showPanel('<h2>🏆 Насколько ты Ксюха?</h2><p>Вопрос '+(quizIndex+1)+' из '+quiz.length+': '+q.q+'</p><div class="answers">'+q.a.map((a,i)=>'<button onclick="answerQuiz('+i+')">'+a+'</button>').join('')+'</div>')}
function answerQuiz(i){if(i===quiz[quizIndex].correct)quizScore++;quizIndex++;renderQuiz()}
const fortunes=['👑 Королева пельменей','🐄 Главная корова района','🪳 Укротительница тараканов','💩 Императрица респекта','🛋️ Повелительница дивана','🚀 Ксюха 999 уровня','🍕 Министр пиццы','😂 Генерал мемных войск'];
function wheel(){if(wheelBusy)return;wheelBusy=true;showPanel('<h2>🎰 Рулетка судьбы Ксюхи</h2><p id="fortune" style="font-size:1.7rem;font-weight:900">🎲 Крутим...</p><button id="spin" disabled>Крутится...</button>');let tick=0;const target=document.getElementById('fortune');const timer=setInterval(()=>{target.textContent=fortunes[Math.floor(Math.random()*fortunes.length)];tick++;if(tick>=22){clearInterval(timer);target.textContent='ТВОЙ ТИТУЛ: '+fortunes[Math.floor(Math.random()*fortunes.length)];document.getElementById('spin').disabled=false;document.getElementById('spin').textContent='🎰 Крутить ещё';document.getElementById('spin').onclick=wheel;wheelBusy=false;burst('🎉')}},100)}
function revealEaster(){document.getElementById('easter-message').classList.add('visible');for(let i=0;i<5;i++)setTimeout(()=>burst('❤️'),i*180)}
</script></body></html>
